name: HACS validation

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v3"
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
      - name: Unit tests (no HA runtime)
        run: |
          python3 custom_components/pax_ble/test_units_compat.py -v
          python3 custom_components/pax_ble/test_device_lookup.py -v
